<!DOCTYPE html><html><head><meta charset="utf-8"><script src="../support.js"></script>

<style>
body { margin:0; background:#26292e; font-family:'Google Sans Flex',sans-serif; }

<body><section style="display:flex;gap:40px;align-items:flex-start">  <div style="display:flex; flex-direction:column; gap:12px">
    <div style="font:600 12px 'Google Sans Flex'; letter-spacing:0.5px; color:#9AA1AA; text-transform:uppercase">Light · Filtered to empty</div>
    <div style="width:412px; height:640px; background:#F5F6F8; border-radius:24px; border:1px solid #3a3f46; display:flex; flex-direction:column; padding:20px 20px 24px; box-sizing:border-box">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:4px 4px 0">
        <div style="font:700 24px 'Google Sans Flex'; color:#14171B">Fuel</div>
        <div style="height:40px; border-radius:14px; background:#F4511E; display:flex; align-items:center; gap:6px; padding:0 16px; font:700 13px 'Google Sans Flex'; color:#FFFFFF"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>Add fuel</div>
      </div>
      <div style="display:flex; gap:8px; margin-top:16px">
        <div style="height:36px; border-radius:7px; background:#FFFFFF; border:1px solid #E9EBEF; color:#14171B; display:flex; align-items:center; padding:0 14px; font:600 12px 'Google Sans Flex'; box-sizing:border-box">All fills</div>
        <div style="height:36px; border-radius:7px; background:#FFFFFF; border:1px solid #E9EBEF; color:#14171B; display:flex; align-items:center; padding:0 14px; font:600 12px 'Google Sans Flex'; box-sizing:border-box">Full</div>
        <div style="height:36px; border-radius:7px; background:#14171B; color:#FFFFFF; display:flex; align-items:center; padding:0 14px; font:700 12px 'Google Sans Flex'">Partial</div>
        <div style="height:36px; border-radius:7px; background:#FFFFFF; border:1px solid #E9EBEF; color:#14171B; display:flex; align-items:center; padding:0 14px; font:600 12px 'Google Sans Flex'; box-sizing:border-box">Adjustments</div>
      </div>
      <div style="border-radius:18px; background:#FFFFFF; border:1px solid #E9EBEF; padding:24px 20px; margin-top:14px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center">
        <div style="font:700 15px 'Google Sans Flex'; color:#14171B">No partial fills</div>
        <div style="font:500 13px 'Google Sans Flex'; line-height:1.5; color:#878E98">Every fill so far was a full tank — good news for mileage.</div>
        <a href="#" style="font:700 13px 'Google Sans Flex'; color:#F4511E; padding:6px">Show all fills</a>
      </div>
    </div>
  </div>
