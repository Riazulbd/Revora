<!DOCTYPE html><html><head><meta charset="utf-8"><script src="../support.js"></script>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..800&display=swap" rel="stylesheet">
<style>
body { margin:0; background:#26292e; font-family:'Google Sans Flex',sans-serif; }
a { color:#F4511E; text-decoration:none; }

<style>body{margin:0;padding:24px;background:#26292e;display:inline-block}</style></head>
<body><section style="display:flex;gap:40px;align-items:flex-start">  <div style="display:flex; flex-direction:column; gap:12px">
    <div style="font:600 12px 'Google Sans Flex'; letter-spacing:0.5px; color:#9AA1AA; text-transform:uppercase">Safety · Never checked (dark)</div>
    <div style="width:412px; background:#101214; border-radius:24px; border:1px solid #3a3f46; display:flex; flex-direction:column; padding:20px; box-sizing:border-box">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:4px 4px 0">
        <div style="font:700 24px 'Google Sans Flex'; color:#F2F4F6">Safety</div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px">
        <div style="border-radius:11px; background:#191C20; border:1px dashed #2C3138; padding:11px 12px"><span style="font:700 13px 'Google Sans Flex'; color:#9AA1AA">Tyres</span><div style="font:500 11px 'Google Sans Flex'; color:#9AA1AA; margin-top:3px">Never checked</div></div>
        <div style="border-radius:11px; background:#191C20; border:1px dashed #2C3138; padding:11px 12px"><span style="font:700 13px 'Google Sans Flex'; color:#9AA1AA">Chain</span><div style="font:500 11px 'Google Sans Flex'; color:#9AA1AA; margin-top:3px">Never checked</div></div>
        <div style="border-radius:11px; background:#191C20; border:1px dashed #2C3138; padding:11px 12px"><span style="font:700 13px 'Google Sans Flex'; color:#9AA1AA">Brakes</span><div style="font:500 11px 'Google Sans Flex'; color:#9AA1AA; margin-top:3px">Never checked</div></div>
        <div style="border-radius:11px; background:#191C20; border:1px dashed #2C3138; padding:11px 12px"><span style="font:700 13px 'Google Sans Flex'; color:#9AA1AA">Battery</span><div style="font:500 11px 'Google Sans Flex'; color:#9AA1AA; margin-top:3px">Never checked</div></div>
      </div>
      <div style="border-radius:18px; background:#191C20; border:1px solid #2C3138; padding:24px 20px; margin-top:14px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FF6B3D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.4 3 7.8 7 9 4-1.2 7-4.6 7-9V6l-7-3Z"/></svg>
        <div style="font:700 15px 'Google Sans Flex'; color:#F2F4F6">Two minutes before a ride</div>
        <div style="font:500 13px 'Google Sans Flex'; line-height:1.5; color:#9AA1AA; max-width:280px">Walk around the bike and mark each area OK, watch or action. No score, no grade — just what you&rsquo;d act on.</div>
        <div style="height:48px; border-radius:14px; background:#FF6B3D; display:flex; align-items:center; justify-content:center; font:700 14px 'Google Sans Flex'; color:#101214; padding:0 22px; margin-top:4px">Start first check</div>
      </div>
    </div>
  </div>

</section></body></html>
