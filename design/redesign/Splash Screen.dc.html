<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus Jakarta Sans:wght@500;600;700;800&amp;family=Caveat:wght@600;700&amp;display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
body { margin:0; background:#26292e; font-family:'Google Sans Flex',sans-serif; }
a { color:#F4511E; text-decoration:none; }
@keyframes loadbar { 0% { width:12%; } 60% { width:74%; } 100% { width:92%; } }
</style>
</helmet>
<section style="padding:48px; display:flex; gap:40px; align-items:flex-start; flex-wrap:wrap">

  <!-- SPLASH · WHITE -->
  <div style="display:flex; flex-direction:column; gap:12px">
    <div style="font:600 12px 'Google Sans Flex'; letter-spacing:0.5px; color:#9AA1AA; text-transform:uppercase">Splash · White</div>
    <div style="width:412px; height:892px; border-radius:24px; border:1px solid #3a3f46; background:#FFFFFF; display:flex; flex-direction:column; padding:24px; box-sizing:border-box; overflow:hidden">
      <div style="display:flex; justify-content:flex-end">
        <div style="text-align:right">
          <div style="font:700 13px 'Google Sans Flex'; line-height:1.45; color:#14171B">Your bike<br>Your data<br>A better ride</div>
          <div style="width:52px; height:3px; border-radius:2px; background:#F4511E; margin:8px 0 0 auto"></div>
        </div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:16px; margin-top:6px">
        <img src="./uploads/logo-clean.png" alt="Revora" style="width:96px; height:96px; object-fit:contain; ">
        <div style="display:flex; flex-direction:column; align-items:center; gap:8px">
          <div style="font:800 32px 'Google Sans Flex'; letter-spacing:7px; color:#14171B; margin-right:-7px">REVORA</div>
          <div style="font:700 10.5px 'Google Sans Flex'; letter-spacing:0.95px; text-transform:uppercase; color:#878E98">Track · Maintain · Ride better</div>
        </div>
      </div>
      <div style="display:flex; gap:6px; justify-content:space-between; margin-top:22px">
        <div style="display:flex; flex-direction:column; align-items:center; gap:7px; flex:0 1 auto">
          <div style="width:56px; height:56px; border-radius:16px; background:#FDEAE3; display:flex; align-items:center; justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F4511E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22h12M4 9h10M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2 2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"></path></svg></div>
          <div style="font:700 10px 'Google Sans Flex'; color:#14171B; text-align:center; line-height:1.3; white-space:nowrap">Track fuel</div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:7px; flex:0 1 auto">
          <div style="width:56px; height:56px; border-radius:16px; background:#E7EEFC; display:flex; align-items:center; justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2E6BE6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg></div>
          <div style="font:700 10px 'Google Sans Flex'; color:#14171B; text-align:center; line-height:1.3; white-space:nowrap">Log services</div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:7px; flex:0 1 auto">
          <div style="width:56px; height:56px; border-radius:16px; background:#E0F4F2; display:flex; align-items:center; justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E9488" stroke-width="2.2" stroke-linecap="round"><path d="M6 19v-5M12 19V9M18 19V4"></path></svg></div>
          <div style="font:700 10px 'Google Sans Flex'; color:#14171B; text-align:center; line-height:1.3; white-space:nowrap">See mileage</div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:7px; flex:0 1 auto">
          <div style="width:56px; height:56px; border-radius:16px; background:#E3F6EE; display:flex; align-items:center; justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0FA968" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4M3 5v14a2 2 0 0 0 2 2h16v-5M18 12a2 2 0 0 0 0 4h4v-4Z"></path></svg></div><div style="font:700 10px 'Google Sans Flex'; color:#14171B; text-align:center; line-height:1.3; white-space:nowrap">Manage costs</div>
          
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; gap:7px; flex:0 1 auto">

        </div>
      </div>
      <div style="flex:1; min-height:0; position:relative; border-radius:20px; overflow:hidden; margin-top:22px; background:#FFFFFF">
        <image-slot id="splash-bike" shape="rounded" radius="20" fit="contain" placeholder="Drop your bike photo" style="background: linear-gradient(180deg, #FFFFFF, #FFFFFF); opacity: 1"></image-slot>
        <div style="position:absolute; left:16px; bottom:12px; pointer-events:none">
          <div style="font:700 32px Caveat, cursive; color:#FFFFFF; line-height:1.05; transform:rotate(-4deg); text-shadow:0 2px 10px rgba(16,18,20,0.65)">More rides,</div>
          <div style="font:700 32px Caveat, cursive; color:#FF6B3D; line-height:1.05; transform:rotate(-4deg); margin-left:24px; text-shadow:0 2px 10px rgba(16,18,20,0.65)">better days</div>
        </div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:20px">
        <div style="width:200px; height:6px; border-radius:3px; background:#F1F2F5; overflow:hidden"><div style="height:100%; border-radius:3px; background:#F4511E; animation:loadbar 2.4s ease-out forwards"></div></div>
        <div style="font:600 13px 'Google Sans Flex'; color:#14171B">Loading your garage…</div>
      </div>
    </div>
  </div>

  <!-- COLD START · WHITE -->
  <div style="display:flex; flex-direction:column; gap:12px">
    <div style="font:600 12px 'Google Sans Flex'; letter-spacing:0.5px; color:#9AA1AA; text-transform:uppercase">Cold start · First frame</div>
    <div style="width:412px; height:892px; border-radius:24px; border:1px solid #3a3f46; background:#FFFFFF; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; box-sizing:border-box; padding:24px">
      <img src="./uploads/logo-clean.png" alt="Revora" style="width:96px; height:96px; object-fit:contain; ">
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px">
        <div style="font:700 28px 'Google Sans Flex'; letter-spacing:6px; color:#14171B; margin-right:-6px">REVORA</div>
        <div style="font:700 10.5px 'Google Sans Flex'; letter-spacing:0.95px; text-transform:uppercase; color:#878E98">Track · Maintain · Ride better</div>
      </div>
      <div style="width:160px; height:5px; border-radius:3px; background:#F1F2F5; overflow:hidden; margin-top:8px"><div style="height:100%; border-radius:3px; background:#F4511E; animation:loadbar 2.4s ease-out forwards"></div></div>
      <div style="font:500 12px 'Google Sans Flex'; color:#878E98">Loading your garage…</div>
    </div>
  </div>

</section>
</x-dc>
</body>
</html>
