appId: app.revora.android.dev
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "screen-dashboard"
    timeout: 30000
- tapOn:
    id: "tab-more"
- tapOn:
    id: "row-analytics"
- extendedWaitUntil:
    visible: "MILEAGE STATS"
    timeout: 15000
- takeScreenshot: shots/54-analytics-dark
- back
- tapOn:
    id: "row-maintenance"
- takeScreenshot: shots/55-maintenance-dark
- back
- scrollUntilVisible:
    element:
      id: "row-settings"
    direction: DOWN
- tapOn:
    id: "row-settings"
- extendedWaitUntil:
    visible: "APPEARANCE"
    timeout: 15000
- tapOn: "Light"
- back
