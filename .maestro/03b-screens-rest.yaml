appId: app.revora.android.dev
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "screen-dashboard"
    timeout: 30000
- tapOn:
    id: "tab-more"
- tapOn:
    id: "row-workshop"
- extendedWaitUntil:
    visible: "Workshop records"
    timeout: 15000
- takeScreenshot: shots/25-workshop
- back
- tapOn:
    id: "row-parts"
- extendedWaitUntil:
    visible: "Parts"
    timeout: 15000
- takeScreenshot: shots/26-parts
- back
- tapOn:
    id: "row-safety"
- extendedWaitUntil:
    visible: "Safety & condition"
    timeout: 15000
- takeScreenshot: shots/27-safety
- back
- tapOn:
    id: "row-vault"
- extendedWaitUntil:
    visible: "Document vault"
    timeout: 15000
- takeScreenshot: shots/28-vault
- back
- tapOn:
    id: "row-warranties"
- extendedWaitUntil:
    visible: "Warranties"
    timeout: 15000
- takeScreenshot: shots/29-warranties
- back
- tapOn:
    id: "row-proof"
- extendedWaitUntil:
    visible: "Proof pack"
    timeout: 15000
- takeScreenshot: shots/30-proof-pack
- back
- tapOn:
    id: "row-analytics"
- extendedWaitUntil:
    visible: "MILEAGE STATS"
    timeout: 15000
- takeScreenshot: shots/31-analytics
- scrollUntilVisible:
    element: "OWNERSHIP COST"
    direction: DOWN
- takeScreenshot: shots/32-analytics-ownership
- back
- tapOn:
    id: "row-notifications"
- extendedWaitUntil:
    visible: "Notifications"
    timeout: 15000
- takeScreenshot: shots/33-notifications
- back
- tapOn:
    id: "row-capture"
- extendedWaitUntil:
    visible: "Fast Capture"
    timeout: 15000
- takeScreenshot: shots/34-capture
- back
- tapOn:
    id: "row-assistant"
- extendedWaitUntil:
    visible: "Assistant"
    timeout: 15000
- takeScreenshot: shots/34b-assistant
- back
- tapOn:
    id: "row-settings"
- extendedWaitUntil:
    visible: "APPEARANCE"
    timeout: 15000
- takeScreenshot: shots/35-settings
- back
- tapOn:
    id: "row-plan"
- extendedWaitUntil:
    visible: "Free / Pro"
    timeout: 15000
- takeScreenshot: shots/36-plan
