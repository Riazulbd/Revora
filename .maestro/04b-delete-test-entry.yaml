appId: app.revora.android.dev
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "screen-dashboard"
    timeout: 30000
- tapOn:
    id: "tab-fuel"
- extendedWaitUntil:
    visible: "1 Sep 2026"
    timeout: 15000
- tapOn: "1 Sep 2026"
- extendedWaitUntil:
    visible: "ADJUSTMENT DETAIL"
    timeout: 15000
- takeScreenshot: shots/44-fuel-detail-adjusted
- scrollUntilVisible:
    element:
      id: "cta-delete"
    direction: DOWN
- tapOn:
    id: "cta-delete"
- extendedWaitUntil:
    visible: "Delete this fuel log?"
    timeout: 5000
- takeScreenshot: shots/45-delete-dialog
- tapOn:
    text: "Delete"
    index: 0
- extendedWaitUntil:
    notVisible: "1 Sep 2026"
    timeout: 20000
- takeScreenshot: shots/46-fuel-list-after-delete
