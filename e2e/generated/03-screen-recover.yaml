# 03-screen-recover
#
# A reset link is the one action Revora cannot queue, so the screen has to
# be honest about it. The invalid address is checked before the network is
# touched; the valid one is submitted so the request path is exercised.
#
# banner-offline here needs the radios down — see the offline phase flow.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/(auth)/recover.tsx
appId: app.revora.android.dev
---
- launchApp:
    clearState: true
- assertVisible:
    id: "screen-welcome"
- tapOn:
    id: "cta-signin"
- tapOn: "Forgot password?"
- assertVisible:
    id: "screen-recover"
# --- invalid ---
- tapOn:
    id: "input-email"
- eraseText
- inputText: "not-an-address"
- hideKeyboard
- tapOn:
    id: "cta-submit"
- assertVisible: "That email address does not look right."
# --- valid ---
- tapOn:
    id: "input-email"
- eraseText
- inputText: "rider@example.com"
- hideKeyboard
- tapOn:
    id: "cta-submit"
- assertVisible:
    id: "screen-recover"

# --- ids this recipe does not claim yet: on screen, but not driven ---
# A rename from the redesign lands here. Give each one a real step in
# e2e/tools/generate.mjs and it moves up into the flow above.
- assertVisible:
    id: "card-sent"
    optional: true
- assertVisible:
    id: "cta-resend"
    optional: true
- assertVisible:
    id: "cta-different-email"
    optional: true
- assertVisible:
    id: "card-fields"
    optional: true
- assertVisible:
    id: "cta-back-to-signin"
    optional: true
