# 00-screen-welcome
#
# Welcome is the first screen a rider ever sees, and the only one that can
# send them to both halves of the account decision. Both buttons are
# followed, because a Create-account button that opens Sign in is the kind
# of defect nobody reports — they just sign in.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/(auth)/welcome.tsx
appId: app.revora.android.dev
---
- launchApp:
    clearState: true
- assertVisible:
    id: "screen-welcome"
- assertVisible: "The motorcycle logbook"
- tapOn:
    id: "cta-signup"
- assertVisible:
    id: "screen-signup"
- back
- assertVisible:
    id: "screen-welcome"
- tapOn:
    id: "cta-signin"
- assertVisible:
    id: "screen-signin"
- back
- assertVisible:
    id: "screen-welcome"
