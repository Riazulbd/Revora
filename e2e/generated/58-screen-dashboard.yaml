# 58-screen-dashboard
#
# The Dashboard once there is something to show: two full tanks, a
# measured interval, and the overdue "E2E Generated Rule" from flow 29 sitting in
# the attention card with a Mark-done button beside it.
#
# That card is what pays for cutting the fifth tab. The screens behind its
# rows are three and four taps deep now, and that is only acceptable
# because anything wrong comes here first.
#
# hint-mileage-estimated belongs to the estimated state, which needs a
# partial-only log — flow 59 builds it.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/(tabs)/dashboard.tsx, src/features/dashboard/AttentionCard.tsx
appId: app.revora.android.dev
---
- launchApp:
    clearState: false
- assertVisible:
    id: "screen-dashboard"
- assertVisible:
    id: "screen-dashboard"
- assertVisible: "CURRENT ODOMETER"
# --- the cost hint, while the distance is still short ---
- assertVisible:
    id: "hint-cost-per-distance"
# --- a measured interval, drawn on the gauge ---
- assertVisible:
    id: "gauge-mileage"
# --- the maintenance rows, and the ledger link ---
- scrollUntilVisible:
    element:
      id: "maintenance-.*"
    direction: DOWN
- tapOn:
    id: "maintenance-.*"
- assertVisible:
    id: "screen-rule"
- back
- scrollUntilVisible:
    element:
      id: "link-activity-all"
    direction: DOWN
- tapOn:
    id: "link-activity-all"
- assertVisible:
    id: "screen-expenses"
- tapOn:
    id: "tab-dashboard"
# --- the attention card, and its inline action ---
- assertVisible:
    id: "card-attention"
- assertVisible:
    id: "attention-.*"
- assertVisible:
    id: "attention-action-.*"
- tapOn:
    id: "attention-action-.*"
- assertVisible:
    id: "sheet-complete"
- back
- tapOn:
    id: "tab-dashboard"
- tapOn:
    id: "attention-[a-z]+.*"
- back
# --- the bell, now that the overdue rule gives it a row to show ---
- tapOn:
    id: "tab-dashboard"
- tapOn:
    id: "cta-notifications"
- assertVisible:
    id: "screen-notifications"
- assertVisible:
    id: "list-notifications"
- tapOn:
    id: "open-.*"
