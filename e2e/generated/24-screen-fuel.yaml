# 24-screen-fuel
#
# The populated log: the summary card, the four filters, and the CSV
# export, which is a Pro feature and therefore opens the gate rather than
# producing a file for a free rider.
#
# Both fills are full tanks, so the Partial filter matches nothing — which
# is a fact about the bike, not a gap in the log, and the screen has to say
# the difference.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/(tabs)/fuel.tsx
appId: app.revora.android.dev
---
- launchApp:
    clearState: false
- assertVisible:
    id: "screen-dashboard"
- tapOn:
    id: "tab-fuel"
- assertVisible:
    id: "screen-fuel"
- assertVisible: "E2E Generated Pump"
- assertVisible:
    id: "card-fuel-summary"
# --- the filters ---
- assertVisible:
    id: "filter-fuel"
- tapOn: "Full"
- tapOn: "Adjustments"
- tapOn: "Partial"
# every fill was a full tank, so this one is empty on purpose
- assertVisible:
    id: "empty-fuel-filtered"
- tapOn:
    id: "cta-show-all-fills"
# --- the spillage from flow 23 has a row of its own on the timeline ---
- assertVisible:
    id: "fuel-adjustment-.*"
# --- a row opens its fill ---
- tapOn:
    id: "fuel-row-.*"
- assertVisible:
    id: "screen-fuel-detail"
- back
# --- the mileage explainer ---
- tapOn: "How mileage is calculated"
- assertVisible:
    id: "sheet-explain"
- back
# --- CSV export is Pro; a free rider meets the gate ---
- scrollUntilVisible:
    element:
      id: "row-export"
    direction: DOWN
- tapOn:
    id: "row-export"
- assertVisible:
    id: "sheet-pro"
- tapOn: "Not now"
