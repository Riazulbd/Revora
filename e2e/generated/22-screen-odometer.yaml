# 22-screen-odometer
#
# Odometer history. A reading the rider typed is theirs to correct; one
# derived from a fuel log or a service is not, and tapping it explains
# why instead of opening an editor that cannot honour the edit.
#
# Correcting the manual 5200 km down below the opening
# 4845 km is what raises banner-odometer-held: the
# odometer cannot fall below a reading another record still holds, and
# the banner names the record holding it.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/garage/odometer.tsx, src/features/fuel/ui/FuelOdometerHistory.tsx
appId: app.revora.android.dev
---
- launchApp:
    clearState: false
- assertVisible:
    id: "screen-dashboard"
- tapOn:
    id: "tab-garage"
- tapOn:
    id: "cta-odometer"
- assertVisible:
    id: "screen-odometer"
- assertVisible:
    id: "card-current-odometer"
# --- a derived reading explains itself rather than opening an editor ---
- tapOn:
    id: "odometer-row-bike:initial"
- assertVisible:
    id: "sheet-odometer-source"
- back
# --- a manual reading opens the correction panel in place ---
- tapOn:
    id: "odometer-row-.*"
- assertVisible:
    id: "panel-correct-odometer"
- tapOn:
    id: "input-correct-odometer"
- eraseText
- inputText: "5300"
- hideKeyboard
- assertVisible:
    id: "preview-odometer"
# --- below a reading another record holds ---
- tapOn:
    id: "input-correct-odometer"
- eraseText
- inputText: "100"
- hideKeyboard
- assertVisible:
    id: "banner-odometer-held"
# --- destructive: the delete dialog, opened and cancelled ---
- scrollUntilVisible:
    element:
      id: "cta-delete-reading"
    direction: DOWN
- tapOn:
    id: "cta-delete-reading"
- assertVisible:
    id: "dialog-delete-reading"
- tapOn:
    id: "dialog-delete-reading-cancel"
- assertNotVisible:
    id: "dialog-delete-reading"
# --- cancelled, then done properly ---
- tapOn:
    id: "cta-cancel-correction"
- assertNotVisible:
    id: "panel-correct-odometer"
- tapOn:
    id: "odometer-row-.*"
- tapOn:
    id: "input-correct-odometer"
- eraseText
- inputText: "5200"
- hideKeyboard
- tapOn:
    id: "cta-save-correction"
