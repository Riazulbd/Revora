# 19-screen-bike-profile
#
# The profile, the odometer update it carries, and the ownership hub —
# eleven rows that are the only way to reach half the app by tapping.
#
# The odometer is validated three ways: blank, below the last reading
# (which offers the correction screen rather than a dead end), and a
# valid 5200 km, which flow 22 then corrects.
#
# Deleting the motorcycle opens its dialog and cancels — the fixture has
# to survive.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/garage/profile.tsx, src/features/bikes/OwnershipHub.tsx
appId: app.revora.android.dev
---
- launchApp:
    clearState: false
- assertVisible:
    id: "screen-dashboard"
- tapOn:
    id: "tab-garage"
- tapOn:
    id: "cta-profile"
- assertVisible:
    id: "screen-bike-profile"
# --- the two copyable identifiers ---
- assertVisible:
    id: "row-engine"
- tapOn:
    id: "row-engine"
- assertVisible:
    id: "row-chassis"
- tapOn:
    id: "row-chassis"
# --- invalid: nothing typed ---
- tapOn:
    id: "input-odometer"
- eraseText
- inputText: " "
- hideKeyboard
- tapOn:
    id: "cta-update-odometer"
- assertVisible: "Enter the current reading."
# --- invalid: below the last reading, which offers the history ---
- tapOn:
    id: "input-odometer"
- eraseText
- inputText: "100"
- hideKeyboard
- tapOn:
    id: "cta-update-odometer"
- assertVisible: ".*The odometer only moves forward.*"
- assertVisible:
    id: "cta-correct-reading"
- tapOn:
    id: "cta-correct-reading"
- assertVisible:
    id: "screen-odometer"
- back
- assertVisible:
    id: "screen-bike-profile"
# --- a jump of more than 5,000 is flagged, not rejected ---
- tapOn:
    id: "input-odometer"
- eraseText
- inputText: "99999"
- hideKeyboard
- assertVisible:
    id: "banner-odometer-jump"
# --- valid ---
- tapOn:
    id: "input-odometer"
- eraseText
- inputText: "5200"
- hideKeyboard
- tapOn:
    id: "cta-update-odometer"
# --- edit details ---
- scrollUntilVisible:
    element:
      id: "cta-edit-details"
    direction: DOWN
- tapOn:
    id: "cta-edit-details"
- assertVisible:
    id: "screen-edit-bike"
- back
