# 37-screen-part-detail
#
# A fitted part: how much life it has left, what it cost, and which
# service it came in on.
#
# Mark removed and Delete are in the destructive flow, because a removal
# has no undo and a deleted part cannot be got back.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/parts/[id].tsx
appId: app.revora.android.dev
---
- launchApp:
    clearState: false
- assertVisible:
    id: "screen-dashboard"
- tapOn:
    id: "tab-garage"
- tapOn:
    id: "cta-profile"
- scrollUntilVisible:
    element:
      id: "hub-parts"
    direction: DOWN
- tapOn:
    id: "hub-parts"
- tapOn: "E2E Generated Part"
- assertVisible:
    id: "screen-part-detail"
- assertVisible: "INSTALLED"
- assertVisible: "EXPECTED"
# --- edit, and back ---
- scrollUntilVisible:
    element:
      id: "cta-edit-part"
    direction: DOWN
- tapOn:
    id: "cta-edit-part"
- assertVisible:
    id: "screen-part-add"
- back
# --- "this is an accessory": dialog opened and cancelled ---
- scrollUntilVisible:
    element:
      id: "cta-convert-to-accessory"
    direction: DOWN
- tapOn:
    id: "cta-convert-to-accessory"
- assertVisible:
    id: "dialog-convert-part"
- tapOn:
    id: "dialog-convert-part-cancel"
- assertNotVisible:
    id: "dialog-convert-part"
# --- the delete dialog exists for a removed part; see flow 91 ---
- assertNotVisible:
    id: "dialog-delete-part"
