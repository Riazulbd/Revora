# A fitted part: how much life it has left, what it cost, and which
# service it came in on.
#
# Mark removed and Delete are in the destructive flow, because a removal
# has no undo and a deleted part cannot be got back.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/parts/[id].tsx
