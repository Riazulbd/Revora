# 05-screen-dashboard-empty
#
# The Dashboard with nothing logged, plus the whole entry layer: the four
# tabs, the bike switcher, search, the bell and the overflow sheet.
#
# cta-first-fill only exists while analytics.isEmpty, so it can only be
# proved here, before any record exists. The populated Dashboard — the
# mileage explainer, the hints, the attention rows — is flow 56.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/(tabs)/dashboard.tsx, src/app/(tabs)/_layout.tsx, src/features/dashboard/EntryLayer.tsx, src/features/bikes/BikeSwitcher.tsx
appId: app.revora.android.dev
---
- launchApp:
    clearState: false
- assertVisible:
    id: "screen-dashboard"
# Nothing logged: the card says it is not watching anything yet, which is
# not the same as "nothing is wrong".
- assertVisible:
    id: "attention-unwatched"
# --- the four tabs go where their labels say ---
- assertVisible:
    id: "tab-bar"
- tapOn:
    id: "tab-fuel"
- assertVisible:
    id: "screen-fuel"
- tapOn:
    id: "tab-expenses"
- assertVisible:
    id: "screen-expenses"
- tapOn:
    id: "tab-garage"
- assertVisible:
    id: "screen-garage"
- tapOn:
    id: "tab-dashboard"
- assertVisible:
    id: "screen-dashboard"
# --- nothing logged: the invitation, not a zero ---
- assertVisible:
    id: "state-no-mileage"
- assertVisible:
    id: "cta-first-fill"
- tapOn:
    id: "cta-first-fill"
- assertVisible:
    id: "screen-fuel-add"
- back
- tapOn: "Or use Fast Capture"
- assertVisible:
    id: "screen-capture"
- back
- tapOn: "Set up maintenance reminders"
- assertVisible:
    id: "screen-maintenance"
- back
- tapOn: "Add registration & insurance documents"
- assertVisible:
    id: "screen-vault"
- back
# --- the entry layer: search on the More tab, the bell on the dashboard ---
- tapOn:
    id: "tab-more"
- tapOn:
    id: "cta-search"
- assertVisible:
    id: "screen-search"
- back
- tapOn:
    id: "tab-dashboard"
- tapOn:
    id: "cta-notifications"
- assertVisible:
    id: "screen-notifications"
- back
- tapOn:
    id: "quick-capture"
- assertVisible:
    id: "screen-capture"
- back
- tapOn:
    id: "quick-documents"
- assertVisible:
    id: "screen-vault"
- back
- tapOn:
    id: "quick-add-fuel"
- assertVisible:
    id: "screen-fuel-add"
- back
# --- the bike switcher ---
- tapOn:
    id: "bike-switcher"
- assertVisible:
    id: "sheet-switcher"
- tapOn:
    id: "switch-bike-.*"
- assertNotVisible:
    id: "sheet-switcher"
- tapOn:
    id: "bike-switcher"
- tapOn:
    id: "switcher-add-bike"
# Free plan: a second motorcycle is a Pro question, so this lands on the plan.
- assertVisible:
    id: "screen-plan"
- back
# --- the More tab: its rows, each opened and returned from ---
- tapOn:
    id: "tab-more"
- assertVisible:
    id: "screen-more"
- tapOn:
    id: "row-settings"
- assertVisible:
    id: "screen-settings"
- back
- tapOn:
    id: "row-plan"
- assertVisible:
    id: "screen-plan"
- back
- tapOn:
    id: "row-assistant"
- assertVisible:
    id: "screen-assistant"
- back
- tapOn:
    id: "row-analytics"
- assertVisible:
    id: "screen-analytics"
- back
- tapOn:
    id: "row-feedback"
- assertVisible:
    id: "screen-feedback"
- back
# Legal lives behind the plan: "Terms & privacy" opens Terms, which links the policy.
- tapOn:
    id: "row-plan"
- scrollUntilVisible:
    element:
      id: "link-terms"
    direction: DOWN
- tapOn:
    id: "link-terms"
- assertVisible:
    id: "screen-terms"
- back
- back

# --- ids this recipe does not claim yet: on screen, but not driven ---
# A rename from the redesign lands here. Give each one a real step in
# e2e/tools/generate.mjs and it moves up into the flow above.
- assertVisible:
