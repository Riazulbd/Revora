    optional: true
- assertVisible:
    id: "card-odometer"
    optional: true
- assertVisible:
    id: "tile-mileage"
    optional: true
- assertVisible:
    id: "chart-spend"
    optional: true
- assertVisible:
    id: "card-spend"
    optional: true
- assertVisible:
    id: "chart-mileage"
    optional: true
- assertVisible:
