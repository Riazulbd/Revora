# 04-screen-onboarding
#
# Creates the fixture every later flow runs against: an anonymous rider
# with one motorcycle, "Audit Bike", opening odometer 4845 km.
#
# Anonymous sign-in is a Firebase call, so this one needs the device
# ONLINE. Engine and chassis numbers are not on this form — they only
# appear when editing a saved bike, and are covered there.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/(onboarding)/add-bike.tsx, src/features/bikes/BikeFormFields.tsx
appId: app.revora.android.dev
---
- launchApp:
    clearState: true
- assertVisible:
    id: "screen-welcome"
- tapOn:
    id: "cta-signin"
- assertVisible:
    id: "screen-signin"
- tapOn:
    id: "cta-anonymous"
- assertVisible:
    id: "screen-onboarding"
# --- invalid: no nickname, a year before motorcycles, no odometer ---
- tapOn:
    id: "input-year"
- eraseText
- inputText: "1200"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "cta-add-bike"
    direction: DOWN
- tapOn:
    id: "cta-add-bike"
- assertVisible: "Give your motorcycle a name."
- assertVisible: "Check the year."
- assertVisible: "Enter the current reading."
- assertVisible:
    id: "screen-onboarding"
# --- valid: every field on the form ---
- tapOn:
    id: "input-manufacturer"
- eraseText
- inputText: "Honda"
- tapOn:
    id: "input-model"
- eraseText
- inputText: "Hornet 2.0"
- tapOn:
    id: "input-nickname"
- eraseText
- inputText: "Audit Bike"
- tapOn:
    id: "input-year"
- eraseText
- inputText: "2025"
- tapOn:
