# 23-screen-fuel-add
#
# The screen that has to work with cold hands and one bar of signal, and
# the only form in the app where three fields derive each other.
#
# Four failures are checked against the message the code really produces:
#   · no odometer  → "Enter the reading at the pump." (a toast, because
#     Save sits below the fold and the field it highlighted does not)
#   · no litres    → "Enter how much fuel you added."
#   · neither price nor total → "Enter a price per litre or a total."
#   · an adjustment as large as the fill → "Adjustments cannot use up the
#     whole fill."
#
# Two fills are left behind — 5100 and 5400 km,
# both full tanks — which is what gives every later flow a measured
# mileage interval to read.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/fuel/add.tsx, src/features/shared/PhotoField.tsx
appId: app.revora.android.dev
---
- launchApp:
    clearState: false
- assertVisible:
    id: "screen-dashboard"
- tapOn:
    id: "quick-add-fuel"
- assertVisible:
    id: "screen-fuel-add"
# --- empty: the toast names the first problem, where the thumb is ---
- scrollUntilVisible:
    element:
      id: "cta-save-fuel"
    direction: DOWN
- tapOn:
    id: "cta-save-fuel"
- assertVisible: "Enter the reading at the pump."
# --- a reading below the last one is flagged, not rejected ---
- tapOn:
    id: "input-odometer"
- eraseText
- inputText: "100"
- hideKeyboard
- assertVisible:
    id: "banner-odometer"
- tapOn:
    id: "link-odometer-history"
- assertVisible:
    id: "screen-odometer"
- back
# --- odometer only, no litres ---
- tapOn:
    id: "input-odometer"
- eraseText
- inputText: "5100"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "cta-save-fuel"
    direction: DOWN
- tapOn:
    id: "cta-save-fuel"
- assertVisible: "Enter how much fuel you added."
# --- litres but no money at all ---
- tapOn:
    id: "input-litres"
- eraseText
- inputText: "7.5"
- tapOn:
    id: "input-price"
- eraseText
- inputText: " "
- tapOn:
    id: "input-total"
- eraseText
- inputText: " "
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "cta-save-fuel"
    direction: DOWN
- tapOn:
    id: "cta-save-fuel"
- assertVisible: "Enter a price per litre or a total."
# --- the date field, and the three fill types ---
- scrollUntilVisible:
    element:
      id: "field-date"
    direction: DOWN
- tapOn:
    id: "field-date"
- tapOn:
    text: "OK"
    optional: true
- assertVisible:
    id: "segment-fill"
- tapOn:
    id: "segment-fill-partial"
- tapOn:
    id: "segment-fill-unknown"
- tapOn:
    id: "segment-fill-full"
# --- price fills the total by itself: 7.5 x 122 = 915 ---
- tapOn:
