- tapOn:
    id: "adjust-amount-leak"
- eraseText
- inputText: "0.1"
- hideKeyboard
- tapOn:
    id: "adjust-maintenance_loss"
- tapOn:
    id: "adjust-amount-maintenance_loss"
- eraseText
- inputText: "0.1"
- hideKeyboard
- tapOn:
