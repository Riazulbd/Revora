# 25-screen-fuel-detail
#
# One fill, with the interval it closed. Edit re-opens the form keyed on
# the record, which is what proves every field initialises from its final
# value rather than through a hydration effect.
#
# Delete opens its dialog and cancels — both fills have to survive for the
# later flows to have a mileage interval to read.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/fuel/[id].tsx
appId: app.revora.android.dev
---
- launchApp:
    clearState: false
- assertVisible:
    id: "screen-dashboard"
- tapOn:
    id: "tab-fuel"
- tapOn: "E2E Generated Pump Two"
- assertVisible:
    id: "screen-fuel-detail"
# --- the second fill closed an interval, so it shows the arithmetic ---
- assertVisible:
    id: "card-mileage-breakdown"
- assertVisible:
    id: "card-adjustments"
# --- the first fill closed nothing, and says why instead of a zero ---
- back
- tapOn: "E2E Generated Pump"
- assertVisible:
    id: "screen-fuel-detail"
- assertVisible:
    id: "card-no-mileage"
# --- edit, and back out without changing anything ---
- scrollUntilVisible:
    element:
      id: "cta-edit"
    direction: DOWN
- tapOn:
    id: "cta-edit"
- assertVisible:
    id: "screen-fuel-add"
- back
# --- destructive: opened and cancelled ---
- scrollUntilVisible:
    element:
      id: "cta-delete"
    direction: DOWN
- tapOn:
    id: "cta-delete"
- assertVisible:
    id: "dialog-delete-fuel"
- tapOn:
    id: "dialog-delete-fuel-cancel"
- assertNotVisible:
    id: "dialog-delete-fuel"
