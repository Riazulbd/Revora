# 50-screen-assistant
#
# Every figure the assistant quotes is read from the same deterministic
# calculations the rest of the app shows — it never estimates a number,
# which is also why it works with no connection.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/assistant.tsx, src/features/premium/ProUpsell.tsx
appId: app.revora.android.dev
---
- launchApp:
    clearState: false
- assertVisible:
    id: "screen-dashboard"
- tapOn:
    id: "tab-more"
- tapOn:
    id: "row-assistant"
- assertVisible:
    id: "screen-assistant"
# On Free the assistant answers on the device, and the notice says so
# rather than pretending the Pro one is unavailable.
- assertVisible:
    id: "assistant-first-use"
- scrollUntilVisible:
    element:
      id: "cta-assistant-plan"
    direction: DOWN
- tapOn:
    id: "cta-assistant-plan"
- assertVisible:
    id: "screen-plan"
- back
# --- a suggested question ---
- tapOn:
    id: "suggest-.*"
- assertVisible:
    id: "bubble-.*"
# --- and one typed ---
- tapOn:
    id: "input-assistant"
- eraseText
- inputText: "What is my average mileage?"
- tapOn:
    id: "cta-assistant-send"
- assertVisible:
    id: "screen-assistant"

# --- ids this recipe does not claim yet: on screen, but not driven ---
# A rename from the redesign lands here. Give each one a real step in
# e2e/tools/generate.mjs and it moves up into the flow above.
- assertVisible:
    id: "banner-assistant-coming-soon"
    optional: true
- assertVisible:
    id: "banner-assistant-coming-soon"
    optional: true
