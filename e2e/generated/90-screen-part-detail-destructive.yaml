# 90-screen-part-detail-destructive
#
# DESTRUCTIVE. Marking a part removed has no undo, and Delete only exists
# once it is removed — so the two are one flow, and it runs on the spare
# part (E2E Spare Part One) rather than the one flow 37 reads.
#
# Removal is what turns expected life into measured life, which is the
# whole reason the reading it came off at is asked for.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/parts/[id].tsx
appId: app.revora.android.dev
---
- launchApp:
    clearState: false
- assertVisible:
    id: "screen-dashboard"
- tapOn:
    id: "tab-garage"
- tapOn:
    id: "cta-profile"
- scrollUntilVisible:
    element:
      id: "hub-parts"
    direction: DOWN
- tapOn:
    id: "hub-parts"
- tapOn: "E2E Spare Part One"
- assertVisible:
    id: "screen-part-detail"
# --- mark removed ---
- scrollUntilVisible:
    element:
      id: "cta-remove-part"
    direction: DOWN
- tapOn:
    id: "cta-remove-part"
- tapOn:
    id: "input-remove-odometer"
- eraseText
- inputText: "5800"
- hideKeyboard
- tapOn:
    id: "cta-confirm-remove"
- assertVisible: "REMOVED"
- back
- assertVisible:
    id: "list-parts-removed"
# --- remove the other one as well: nothing fitted, history intact ---
- tapOn: "E2E Generated Part"
- scrollUntilVisible:
    element:
      id: "cta-remove-part"
    direction: DOWN
- tapOn:
    id: "cta-remove-part"
- tapOn:
    id: "input-remove-odometer"
- eraseText
- inputText: "5800"
- hideKeyboard
- tapOn:
    id: "cta-confirm-remove"
- back
- assertVisible:
    id: "empty-parts-active"
- assertVisible:
    id: "list-parts-removed"
- tapOn:
    id: "cta-empty-active-add-part"
- assertVisible:
    id: "screen-part-add"
- back
# --- and delete the spare ---
- tapOn: "E2E Spare Part One"
# --- and delete it ---
- scrollUntilVisible:
    element:
      id: "cta-delete-part"
    direction: DOWN
- tapOn:
    id: "cta-delete-part"
- assertVisible:
    id: "dialog-delete-part"
- tapOn:
    id: "dialog-delete-part-confirm"
- assertVisible:
    id: "screen-parts"
- assertNotVisible: "E2E Spare Part One"
