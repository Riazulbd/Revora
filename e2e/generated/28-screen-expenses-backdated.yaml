# 28-screen-expenses-backdated
#
# A ledger that is not empty and a month that is: the one state where the
# "Nothing spent in <month>" card is right and the page-level empty state
# would be wrong.
#
# It needs a record dated outside this month, so this flow walks the
# Android date picker back a month. That is the only step in the suite
# that depends on the system picker's own chrome.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/(tabs)/expenses.tsx
appId: app.revora.android.dev
---
- launchApp:
    clearState: false
- assertVisible:
    id: "screen-dashboard"
- tapOn:
    id: "tab-expenses"
- tapOn:
    id: "cta-add-expense"
- assertVisible:
    id: "screen-expense-add"
- tapOn:
    id: "input-amount"
- eraseText
- inputText: "75"
- hideKeyboard
- tapOn:
    id: "field-expense-date"
- tapOn:
    text: "Previous month"
    optional: true
- tapOn:
    text: "15"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    id: "input-expense-note"
- eraseText
- inputText: "E2E Backdated Expense"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "cta-save-expense"
    direction: DOWN
- tapOn:
    id: "cta-save-expense"
- assertVisible:
    id: "screen-expenses"
# Two months back there is nothing, which is the month the card is for.
- tapOn:
    id: "cta-month-previous"
    optional: true
- tapOn:
    id: "cta-month-previous"
    optional: true
- assertVisible:
    id: "empty-expenses-month"
