# 47-screen-capture
#
# One tap now, details later, built for gloves at a pump. A capture is a
# real stored record rather than a note in memory, so it survives the app
# being killed — which is why the queued note is saved and then tapped.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/capture.tsx
appId: app.revora.android.dev
---
- launchApp:
    clearState: false
- assertVisible:
    id: "screen-dashboard"
- tapOn:
    id: "quick-capture"
- assertVisible:
    id: "screen-capture"
# --- nothing captured yet ---
- assertVisible:
    id: "empty-capture"
- assertVisible:
    id: "footnote-capture"
# --- the tiles ---
- tapOn:
    id: "capture-odometer"
- assertVisible:
