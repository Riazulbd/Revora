# An accessory is bought once and stays, so it never enters cost per
# kilometre — a one-off charged against distance would make that figure
# swing. Purchase and fitting are added together, once.
#
# Re-opening reveals the Accessory / Part segment; the conversion dialog
# is opened and cancelled.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/accessories/add.tsx
