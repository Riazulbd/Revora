# 60-screen-fuel-offline
#
# The offline banners. Maestro cannot touch the radios itself, so
# run-generated.sh turns them off around any flow whose name ends
# "-offline" and turns them back on afterwards, whatever happens.
#
# Everything on these screens still works: logs save here and sync later,
# and the banner says exactly that rather than blocking the rider.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/(tabs)/fuel.tsx, src/app/capture.tsx, src/app/(auth)/recover.tsx, src/app/garage/edit.tsx
appId: app.revora.android.dev
---
- launchApp:
    clearState: false
- assertVisible:
    id: "screen-dashboard"
- tapOn:
    id: "tab-fuel"
- assertVisible:
    id: "screen-fuel"
- assertVisible:
    id: "banner-offline"
- tapOn:
    id: "tab-dashboard"
- tapOn:
    id: "quick-capture"
- assertVisible:
    id: "screen-capture"
- assertVisible:
    id: "banner-capture-offline"
# --- a write made with no connection is accepted here and syncs later ---
- back
- tapOn:
    id: "tab-garage"
- tapOn:
    id: "cta-profile"
- scrollUntilVisible:
    element:
      id: "cta-edit-details"
    direction: DOWN
- tapOn:
    id: "cta-edit-details"
- assertVisible:
    id: "screen-edit-bike"
- tapOn:
    id: "input-nickname"
- eraseText
- inputText: "Audit Bike"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "cta-save-bike"
    direction: DOWN
- tapOn:
    id: "cta-save-bike"
- assertVisible:
    id: "banner-saved-offline"
