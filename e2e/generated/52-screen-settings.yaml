# 52-screen-settings
#
# Settings, and the unit sheets behind it. Each unit now has its control
# in the row itself, so a rider can see what they are on without opening
# anything — and the label still opens the full list, which is the only
# place both MPG gallons and the volume unit can live.
#
# Every unit is switched and switched back, because changing one
# re-renders every figure in the app immediately — nothing is stored
# pre-formatted — and the later flows assert kilometres and litres.
#
# Cost basis is left on all-in so flow 53 can prove the ledger hint; flow
# 53 puts it back.
#
# Sign out opens its dialog and cancels: this fixture is an offline
# account, so signing out of it is the same as deleting it.
#
# GENERATED by e2e/tools/generate.mjs — edit the recipe there, not this file.
# Owns: src/app/settings.tsx, src/features/settings/useUnitsSettings.tsx
