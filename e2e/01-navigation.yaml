# Every tab goes where its label says.
#
# 2.4 shipped with this broken: the bar matched its own list against the
# navigator's routes by array position, so tapping Fuel opened the Dashboard.
# A diff cannot catch that. This can.
appId: app.revora.android.dev
---
- launchApp:
    clearState: false

- assertVisible:
    id: "screen-dashboard"

- tapOn:
    id: "tab-fuel"
- assertVisible:
    id: "screen-fuel"

- tapOn:
    id: "tab-expenses"
- assertVisible:
    id: "screen-expenses"

- tapOn:
    id: "tab-garage"
- assertVisible:
    id: "screen-garage"

- tapOn:
    id: "tab-dashboard"
- assertVisible:
    id: "screen-dashboard"
