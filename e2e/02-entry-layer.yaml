# The Dashboard's entry layer, and the More tab beside it.
#
# Each of these is one tap from a cold start by design — Documents at a traffic
# stop, Fast Capture at a pump. Search and the app-level screens live on the
# More tab, one tap away from any tab.
appId: app.revora.android.dev
---
- launchApp:
    clearState: false
- tapOn:
    id: "tab-more"
- tapOn:
    id: "cta-search"
- assertVisible:
    id: "screen-search"
- back

- tapOn:
    id: "tab-dashboard"

- tapOn:
    id: "quick-documents"
- assertVisible:
    id: "screen-vault"
- back

- tapOn:
    id: "quick-capture"
- assertVisible:
    id: "screen-capture"
- back

- tapOn:
    id: "tab-more"
- assertVisible: "Settings"
- assertVisible: "Free / Pro"
- assertVisible: "Feedback & support"

# The More tab is the route to the two screens behind the insights group.
- tapOn:
    id: "row-assistant"
- assertVisible:
    id: "screen-assistant"
- back

- tapOn:
    id: "row-analytics"
- assertVisible:
    id: "screen-analytics"
- back
